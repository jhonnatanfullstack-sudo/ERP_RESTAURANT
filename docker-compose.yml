services:
  postgres:
    image: postgres:17-alpine
    container_name: restaurant_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-restaurant_erp}
      POSTGRES_USER: ${DB_USER:-restaurant_erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-restaurant_erp} -d ${DB_NAME:-restaurant_erp}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
